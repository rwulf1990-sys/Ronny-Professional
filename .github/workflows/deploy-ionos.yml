name: Deploy to IONOS (dis-restaurant.de)

# Läuft bei jeder Änderung am Branch – baut das Paket und lädt es
# per SFTP automatisch zu IONOS hoch. Manuell startbar über den
# "Run workflow"-Button (workflow_dispatch).
on:
  push:
    branches: [ claude/3d-dis-branding-website-fuuefc ]
  workflow_dispatch:

concurrency:
  group: ionos-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build IONOS package
        run: bash scripts/build-ionos.sh

      - name: Install lftp + sshpass
        run: sudo apt-get update && sudo apt-get install -y lftp sshpass

      - name: Deploy via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
        run: |
          if [ -z "$SFTP_HOST" ] || [ -z "$SFTP_USER" ] || [ -z "$SFTP_PASS" ]; then
            echo "::warning::SFTP-Secrets sind noch nicht gesetzt – Deploy wird übersprungen."
            echo "Trage SFTP_HOST, SFTP_USER und SFTP_PASSWORD unter Settings → Secrets → Actions ein."
            exit 0
          fi
          PORT="${SFTP_PORT:-22}"
          REMOTE="${REMOTE_DIR:-/}"

          echo "===== SECRET-CHECK (ohne Preisgabe der Werte) ====="
          echo "USER-Länge: ${#SFTP_USER} Zeichen"
          if [ -z "$SFTP_PASS" ]; then echo "PASS: LEER!"; else echo "PASS: gesetzt (nicht leer)"; fi
          if [ "$SFTP_USER" != "$(printf '%s' "$SFTP_USER" | tr -d '[:space:]')" ]; then echo "WARNUNG: SFTP_USER enthält Leerzeichen/Umbruch!"; else echo "USER: kein Whitespace – ok"; fi
          if [ "$SFTP_PASS" != "$(printf '%s' "$SFTP_PASS" | tr -d '[:space:]')" ]; then echo "WARNUNG: SFTP_PASS enthält Leerzeichen/Umbruch!"; else echo "PASS: kein Whitespace – ok"; fi
          echo "===== ENDE SECRET-CHECK ====="

          echo "===== DIAGNOSE: SSH-Authentifizierung (ssh -v) ====="
          # Zeigt genau, WARUM der Login klappt/scheitert. Das Passwort wird
          # nirgends ausgegeben (ssh -v druckt es nicht). Nicht-fatal.
          sshpass -p "$SFTP_PASS" ssh -v \
            -o StrictHostKeyChecking=no -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no -o ConnectTimeout=20 \
            -p "$PORT" "$SFTP_USER@$SFTP_HOST" "pwd; echo SSH_OK" 2>&1 \
            | grep -iE 'debug1: (Authentications|Next authentication|Offering|Trying|Authenticated)|Permission denied|password|SSH_OK|Connection|refused|banner' \
            || echo "(Diagnose-Kommando endete mit Fehler – siehe Zeilen oben)"
          echo "===== ENDE DIAGNOSE ====="

          echo "Lade ./build nach $REMOTE auf $SFTP_HOST:$PORT ..."
          lftp -c "set sftp:auto-confirm yes; set net:max-retries 1; set net:timeout 25; open -p $PORT sftp://$SFTP_HOST; user \"$SFTP_USER\" \"$SFTP_PASS\"; mirror -R --verbose --no-perms build/ \"$REMOTE\"; bye"
          echo "Deploy abgeschlossen."
