name: Speiseplan Auto-Sync

# Prüft regelmäßig den freigegebenen Google-Drive-Ordner mit dem
# wöchentlichen Mittagstisch-Speiseplan. Liegt dort eine neuere
# PDF als die aktuell verlinkte, wird die Datei-ID in
# restaurant/app.js automatisch aktualisiert, committet und
# gepusht - anschließend werden Deploy-Ionos und Deploy-Pages
# angestoßen. Der Kunde muss dafür nur noch die PDF in den
# Drive-Ordner hochladen.
#
# Einrichtung (einmalig):
#   1. Google-Cloud-Projekt anlegen, "Google Drive API" aktivieren
#      und einen API-Key erstellen (auf die Drive API einschränken).
#   2. Den Drive-Ordner, in den der Kunde die Speiseplan-PDF legt,
#      auf "Jeder mit dem Link -> Betrachter" freigeben.
#   3. Unter Settings -> Secrets and variables -> Actions anlegen:
#      - GOOGLE_DRIVE_API_KEY   -> der API-Key aus Schritt 1
#      - GOOGLE_DRIVE_FOLDER_ID -> die ID aus der Ordner-URL
#        (https://drive.google.com/drive/folders/<HIER-DIE-ID>)
#   Ohne diese beiden Secrets überspringt der Workflow den Sync.
on:
  schedule:
    - cron: '0 6-20 * * *'
  workflow_dispatch:

concurrency:
  group: speiseplan-sync
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Speiseplan aus Drive prüfen
        id: sync
        env:
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: node scripts/sync-speiseplan.mjs

      - name: Änderung committen und pushen
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add restaurant/app.js
          git commit -m "Speiseplan automatisch aktualisiert (${{ steps.sync.outputs.filename }})"
          git push origin HEAD:${{ github.ref_name }}

      - name: Deploy-Workflows anstoßen
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for wf in deploy-ionos.yml deploy-pages.yml; do
            curl -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$wf/dispatches" \
              -d "{\"ref\":\"${{ github.ref_name }}\"}"
          done
